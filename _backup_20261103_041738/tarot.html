<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>AROHA Tarot v1.1</title>
<style>body{margin:0;background:#040508;color:#e2e8f0;font-family:system-ui} .topbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:rgba(8,10,18,.95);border-bottom:1px solid rgba(0,240,255,.35);flex-wrap:wrap;gap:8px} .brand{font-family:monospace;color:#00f0ff;font-weight:bold} button{cursor:pointer;background:rgba(0,240,255,.1);border:1px solid rgba(0,240,255,.35);color:#d0f0ff;padding:6px 10px;border-radius:5px;font-family:monospace;font-size:.75rem} button.gold{background:rgba(255,215,0,.18);border-color:#ffd700;color:#ffd700;font-weight:bold} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:18px;max-width:1200px;margin:0 auto} .slot{background:rgba(12,15,28,.92);border:1px solid rgba(216,128,255,.4);border-radius:10px;padding:16px;min-height:190px} .card-title{font-size:1.05rem;color:#ffd700;font-weight:bold;margin:8px 0} .panel{max-width:1200px;margin:0 auto 18px;padding:16px;background:rgba(10,12,22,.92);border:1px solid rgba(0,240,255,.3);border-radius:10px;font-family:monospace;font-size:.8rem}</style>
</head><body>
<div class="topbar"><div class="brand">🃏 AROHA 4-POINT TAROT v1.1 // FISHER-YATES & DOME LINK</div><div><span id="dome-status">Dome Ledger: Checking...</span> <button id="btn-draw" class="gold">🔀 Draw 4</button> <button id="btn-commit">✓ Commit to Ledger</button> <a href="aroha_master_matrix_app.html" style="color:#00f0ff">🌐 Dome</a></div></div>
<div class="grid" id="spread-grid"><div class="slot"><h3>Point 1: Spark</h3><div class="card-title" id="c0">Tap Draw</div><div id="m0"></div></div><div class="slot"><h3>Point 2: Terra 36.6C</h3><div class="card-title" id="c1">Tap Draw</div><div id="m1"></div></div><div class="slot"><h3>Point 3: Bridge</h3><div class="card-title" id="c2">Tap Draw</div><div id="m2"></div></div><div class="slot"><h3>Point 4: Container</h3><div class="card-title" id="c3">Tap Draw</div><div id="m3"></div></div></div>
<div class="panel" id="log-panel">Ready - unbiased Fisher-Yates, 4 unique cards.</div>
<script>
const DECK=[{name:"0. The Fool (Te Pō)",meaning:"Zero-Point potential"},{name:"I. Magician (Spark)",meaning:"Vector alignment"},{name:"II. High Priestess (Wai)",meaning:"Lunar memory"},{name:"III. Empress (36.6C)",meaning:"Biological abundance"},{name:"VI. Lovers (Point 25)",meaning:"Reciprocal Handshake 1+1=3"},{name:"IX. Hermit (Observer)",meaning:"Sovereign lantern"},{name:"X. Wheel (Torus)",meaning:"Recursive Mauri"},{name:"XIV. Temperance (Alchemy)",meaning:"Thermal balancer"},{name:"XVII. Star (starmaps13)",meaning:"Celestial carrier"},{name:"XIX. Sun (Rākaunui)",meaning:"Gold coherence"},{name:"XXI. World (Dome)",meaning:"4-Quadrant completion"}];
let spread=[];
function draw(){const a=[...DECK];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} spread=a.slice(0,4); spread.forEach((c,i)=>{document.getElementById('c'+i).textContent=c.name;document.getElementById('m'+i).textContent=c.meaning}); document.getElementById('log-panel').textContent='Fisher-Yates draw - 4 unique - ready for handshake';}
document.getElementById('btn-draw').addEventListener('click',draw);
document.getElementById('btn-commit').addEventListener('click',async()=>{if(!spread.length)draw();try{const r=await fetch('/api/tarot/handshake',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({entry:{cards:spread.map(c=>c.name),ts:new Date().toISOString()}})});const d=await r.json();document.getElementById('log-panel').textContent='Committed! Hash '+d.hash;document.getElementById('dome-status').textContent='Dome Ledger: Connected ['+d.hash+']';document.getElementById('dome-status').style.color='#00ff88'}catch(e){document.getElementById('log-panel').textContent='Saved locally (Dome offline)'}});
fetch('/api/ledger').then(r=>r.json()).then(d=>{document.getElementById('dome-status').textContent='Dome Ledger: Connected ('+d.count+' blocks)';document.getElementById('dome-status').style.color='#00ff88'}).catch(()=>{document.getElementById('dome-status').textContent='Dome Ledger: Offline'}); draw();
</script></body></html>
