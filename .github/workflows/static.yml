<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AROHA Master Matrix Preview</title>
    <style>
        body { margin: 0; background: #040508; color: #e2e8f0; font-family: sans-serif; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 420px; background: rgba(8,10,16,0.95); border-right: 1px solid rgba(0,240,255,0.3); padding: 15px; overflow-y: auto; }
        .main-view { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        h1 { font-size: 1rem; color: #00f0ff; margin-top: 0; }
        .row { display: flex; justify-content: space-between; font-family: monospace; font-size: 0.75rem; margin: 4px 0; }
        .section { font-size: 0.7rem; text-transform: uppercase; color: #ffb86a; margin: 10px 0 4px 0; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 6px; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
        button { background: rgba(0,240,255,0.1); border: 1px solid rgba(0,240,255,0.3); color: #b8d8e8; padding: 6px; border-radius: 4px; cursor: pointer; font-family: monospace; font-size: 0.7rem; }
        button.active { background: rgba(216,128,255,0.3); border-color: #d880ff; color: #fff; font-weight: bold; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1>AROHA Master Matrix // Local Preview</h1>
        <div class="row"><span>Active Layer:</span><strong style="color:#ffb86a;">Tier 6: Sentient Observer</strong></div>
        <div class="row"><span>Resonance Ladder:</span><strong style="color:#ffd700;">Level 9: Citrine / Gold (Au)</strong></div>
        <div class="row"><span>Thermal Baseline:</span><span><strong>38.1</strong> °C | <strong>285.31</strong> Hz</span></div>
        <div class="row"><span>Entropy S(ρ_A):</span><span><strong>0.4285</strong> bits (<span style="color:#d880ff;">1+1=3</span>)</span></div>
        <div class="section">1. 6-Tier Consciousness Scale</div>
        <div class="grid" style="grid-template-columns: repeat(2, 1fr);">
            <button>1. Gases (Hau)</button><button>2. Liquids (Wai)</button><button>3. Plant Life</button><button>4. Fish / Aquatic</button><button>5. Mammals (36.6C)</button><button class="active">6. Sentient Dome</button>
        </div>
        <div class="section">2. 9-Level Resonance Ladder</div>
        <div class="grid"><button>Lvl 3: Fe</button><button>Lvl 6: Cu</button><button class="active">Lvl 9: Au</button></div>
        <div class="section">3. Vocal Key Gate</div>
        <div class="grid" style="grid-template-columns: repeat(6, 1fr);"><button>C</button><button class="active">A</button><button>E</button><button>I</button><button>O</button><button>U</button></div>
    </div>
    <div class="main-view"><canvas id="preview-canvas"></canvas></div>
    <script>
        const canvas = document.getElementById('preview-canvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = canvas.parentElement.clientWidth; canvas.height = canvas.parentElement.clientHeight; }
        window.addEventListener('resize', resize); resize();
        let angle = 0;
        function draw() {
            ctx.fillStyle = 'rgba(4, 5, 8, 0.25)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const cx = canvas.width / 2, cy = canvas.height / 2;
            ctx.save(); ctx.translate(cx, cy); ctx.rotate(angle);
            for (let r = 140; r > 20; r -= 20) {
                ctx.beginPath(); ctx.arc(0, 0, r + Math.sin(angle * 2 + r) * 8, 0, Math.PI * 2);
                ctx.strokeStyle = r === 140 ? '#00f0ff' : (r === 80 ? '#d880ff' : '#ffd700'); ctx.lineWidth = 1.5; ctx.stroke();
            }
            ctx.restore(); angle += 0.01; requestAnimationFrame(draw);
        }
        requestAnimationFrame(draw);
    </script>
</body>
</html>
